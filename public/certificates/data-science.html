<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate — Data Science Basics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .cert-serif { font-family: 'Playfair Display', serif; }
    .seal { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-2xl w-full bg-white border-8 border-slate-900 shadow-2xl p-10 md:p-16 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-20 h-20 border-t-8 border-l-8 border-slate-900"></div>
    <div class="absolute top-0 right-0 w-20 h-20 border-t-8 border-r-8 border-slate-900"></div>
    <div class="absolute bottom-0 left-0 w-20 h-20 border-b-8 border-l-8 border-slate-900"></div>
    <div class="absolute bottom-0 right-0 w-20 h-20 border-b-8 border-r-8 border-slate-900"></div>

    <div class="relative z-10">
      <div class="flex justify-between items-start mb-8">
        <div class="text-slate-900">
          <p class="text-xs uppercase tracking-widest text-slate-500 font-semibold">Certificate of Completion</p>
          <h1 class="cert-serif text-4xl md:text-5xl font-bold text-cyan-900 mt-2">Data Science Basics</h1>
        </div>
        <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center border-2 border-cyan-200 seal">
          <span class="text-cyan-600 text-xs font-bold uppercase tracking-wider">ZJG</span>
        </div>
      </div>

      <p class="text-slate-600 text-lg mb-8">
        This is awarded to
      </p>

      <div class="cert-serif text-3xl md:text-4xl font-bold text-slate-900 mb-8 border-b-2 border-b-slate-200 pb-4">
        Zyryll Jemson Galang
      </div>

      <p class="text-slate-600 mb-6">
        for successfully completing the course
      </p>

      <div class="grid grid-cols-2 gap-6 mb-10">
        <div>
          <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Issuer</p>
          <p class="text-slate-900 font-semibold">Dicoding</p>
        </div>
        <div>
          <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Date</p>
          <p class="text-slate-900 font-semibold">October 2024</p>
        </div>
      </div>

      <div class="mt-12 pt-8 border-t border-slate-200 flex justify-between items-center text-sm">
        <div class="text-slate-500">
          <p class="font-semibold text-slate-900">Certificate ID</p>
          <p class="text-slate-400">ZJG-DS-2024-006</p>
        </div>
        <div class="text-slate-500">
          <p class="font-semibold text-slate-900">Verify</p>
          <p class="text-slate-400">dicoding.com/certificates</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
