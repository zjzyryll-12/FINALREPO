<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do List — Zyryll Jemson Galang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 border border-slate-200">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-900">My Tasks</h1>
      <span class="text-xs font-semibold text-cyan-600 bg-cyan-50 px-3 py-1 rounded-full">Zyryll Jemson Galang</span>
    </div>

    <div class="flex gap-2 mb-6">
      <input
        id="todoInput"
        type="text"
        placeholder="Add a new task…"
        class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none text-slate-900 placeholder-slate-400 transition-all"
      />
      <button
        id="addBtn"
        class="px-6 py-3 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold rounded-xl transition-all active:scale-95 shadow-md hover:shadow-cyan-500/30"
      >
        Add
      </button>
    </div>

    <ul id="todoList" class="space-y-3">
      <!-- tasks will appear here -->
    </ul>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <p class="text-sm text-slate-500">Built with HTML, Tailwind CSS &amp; Vanilla JS</p>
      <a href="https://github.com/zyrylljemsonag" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-cyan-600 hover:underline mt-2 inline-block">View on GitHub &rarr;</a>
    </div>
  </div>

  <script>
    const input = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('todoList');

    let tasks = [
      { id: 1, text: "Learn React and Tailwind CSS", done: false },
      { id: 2, text: "Build a simple portfolio", done: true },
      { id: 3, text: "Deploy to Vercel", done: false }
    ];

    function render() {
      list.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 transition-all group ${task.done ? 'opacity-60' : ''}`;
        li.innerHTML = `
          <div class="flex items-center gap-3">
            <input
              type="checkbox"
              ${task.done ? 'checked' : ''}
              class="w-5 h-5 text-cyan-600 rounded focus:ring-cyan-500"
              onchange="toggle(${task.id})"
            />
            <span class="text-slate-900 text-sm ${task.done ? 'line-through text-slate-400' : ''}">${task.text}</span>
          </div>
          <button onclick="remove(${task.id})" class="text-slate-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        `;
        list.appendChild(li);
      });
    }

    function add() {
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      render();
    }

    function toggle(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      render();
    }

    function remove(id) {
      tasks = tasks.filter(t => t.id !== id);
      render();
    }

    addBtn.addEventListener('click', add);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') add(); });

    render();
  </script>
</body>
</html>
